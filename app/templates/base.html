<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Stableford{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/share.js"></script>
<script src="/static/photo.js" defer></script>
</head>
<body>
<header>
  <a class="brand" href="/">⛳ Stableford</a>
  <a href="/runden/neu">Neue Runde</a>
  <a href="/mitglieder">Mitglieder</a>
  <a href="/plaetze">Plätze</a>
  <a href="/einstellungen">Einstellungen</a>
</header>
<main>
{% if storage_local %}
<div class="info warn noprint" style="background:#fdecea;border-color:#e0a39d">
  Achtung: Dropbox ist nicht verbunden. Alles, was du jetzt erfasst, geht beim nächsten Neustart der App verloren.
  <a href="/dropbox">Dropbox einrichten</a>
</div>
{% endif %}
{% block content %}{% endblock %}
</main>
</body>
</html>
