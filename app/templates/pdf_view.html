<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  html, body { height:100%; margin:0; }
  body { display:flex; flex-direction:column; }
  .pdfbar { background:var(--green); padding:8px 12px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .pdfbar .btn { margin:0; background:#fff; color:var(--green); font-weight:600; }
  .pdfbar .btn.sec { background:rgba(255,255,255,.2); color:#fff; font-weight:normal; }
  .pdfbar .back { margin-right:auto; }
  .pdfframe { flex:1; width:100%; border:0; background:#fff; }
</style>
</head>
<body>
<div class="pdfbar">
  <a class="btn back" href="{{ back_url }}">← Zurück zur App</a>
  <a class="btn sec" href="{{ pdf_url }}" target="_blank" rel="noopener">PDF öffnen</a>
  <button class="sec" style="background:rgba(255,255,255,.2);color:#fff;margin:0" onclick="printPdf()">Drucken</button>
</div>
<iframe class="pdfframe" id="pdf" src="{{ pdf_url }}" title="{{ title }}"></iframe>
<script>
function printPdf() {
  try { document.getElementById("pdf").contentWindow.print(); }
  catch (e) { window.open({{ pdf_url|tojson }}, "_blank"); }
}
</script>
</body>
</html>
